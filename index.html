<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyArKo Games</title>
<meta name="description" content="MyArKo Games: casual mobile games.">
<style>
  :root { --bg: #ffffff; --fg: #1d1d24; --muted: #5d5d6a; --link: #3f5fd8; --line: #e4e4ec; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15151b; --fg: #ececf2; --muted: #a0a0ae; --link: #8ea6ff; --line: #2c2c36; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 32px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  ul { list-style: none; padding: 0; margin: 0 0 32px; }
  li { padding: 14px 0; border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }
  a { color: var(--link); }
  .game { font-weight: 600; }
  .links { display: block; font-size: 14px; margin-top: 4px; }
  footer { font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>MyArKo Games</h1>
  <p>Casual mobile games.</p>
  <h2>Games</h2>
  <ul>
    <li>
      <span class="game">Snake Odyssey 3D: Eat It All</span>
      <span class="links">
        <a href="https://play.google.com/store/apps/details?id=com.myarkogames.snakeodyssey">Google Play</a> ·
        <a href="https://myarkogames.github.io/privacy-policy/snake-odyssey/">Privacy policy</a>
      </span>
    </li>
  </ul>
  <footer>Contact: <a href="mailto:myarkogames@gmail.com">myarkogames@gmail.com</a> · <a href="https://myarkogames.github.io/privacy-policy/">All privacy policies</a></footer>
</main>
</body>
</html>
